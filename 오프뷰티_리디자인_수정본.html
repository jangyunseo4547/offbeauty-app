<style>
:root{

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;display:flex;justify-content:center;align-items:center}

.search{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:12px 16px;color:var(--muted);text-align:left}

.thumb svg,.brand i svg,.rc .ph svg,.ph0 svg{width:100%;height:100%;display:block}

.pbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;text-align:center;padding:12px 4px 8px}.pbar button{display:grid;place-items:center;height:40px}
.pbody{flex:1;overflow-y:auto;padding-bottom:28px;scrollbar-width:none}
.u{display:flex;align-items:center;gap:10px;padding:8px 16px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.car>div{flex:none;width:100%;aspect-ratio:1/1;scroll-snap-align:center}.car svg{width:100%;height:100%;display:block}

.pchip .thumb{width:52px;height:52px;border-radius:10px}.pt{flex:1;min-width:0}
.nm1{font-weight:500;font-size:13px;margin:1px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{padding:0 16px;margin:14px 0 6px;white-space:pre-line}.tg{padding:0 16px;margin:0;color:var(--plum);font-weight:500}.pd{padding:0 16px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:20;white-space:nowrap}

function pic(id,m,s){return '<img class="photo" src="'+PHOTO[id%PHOTO.length]+'" alt="헤메코랩 참고 상품 사진 · 실제 예시 상품과 다를 수 있음" loading="lazy">'}
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const TABS=[['home','홈'],['find','상품 찾기'],['store','매장 찾기'],['card','멤버십'],['deal','회원 핫딜']];
const S={tab:'home',member:false,cat:'전체',store:0,pid:0,fav:new Set(),lkd:new Set(),q:''};
const $=id=>document.getElementById(id);
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));

function price(p){
  if(p.acc==='A')return `<b class="pr">${p.pr}</b>`;
  if(p.acc==='B')return S.member?`<b class="pr">${p.pr}</b><i class="tag-m">회원가</i>`:`<span class="lock">${ic('lock')} 로그인하고 회원가 보기</span>`;
  return `<span class="lock">${ic('lock')} 가격은 매장에서 확인</span>`;
}
const item=p=>`<button class="item" data-a="open" data-v="${p.id}"><div class="thumb">${pic(p.id,0)}</div><div class="tx"><div class="bn">${p.br}</div><div class="nm">${p.nm}</div>${price(p)}<div class="sub" style="margin-top:4px"><span class="stars">${stars(p.rt)}</span> ${p.rt} · 후기 ${p.n}</div></div></button>`;
const rev=r=>{const p=P[r.ps[0]];return `<button class="rc" data-a="post" data-v="${r.i}"><div class="ph">${pic(r.ps[0],1,r.i)}<span class="cnt">1/${r.n}</span></div><div class="row"><span class="un"><i class="av sm">${r.u[0].toUpperCase()}</i>${r.u}</span><span class="lkc${S.lkd.has(r.i)?' liked':''}">${ic('heart')}${r.lk+(S.lkd.has(r.i)?1:0)}</span></div><p>${r.tx.split('\n')[0]}</p><div class="mp"><b>${p.br}</b> ${p.nm}</div></button>`};
function barcode(){let x=0,o='',r=11;for(let i=0;i<54;i++){r=(r*37+11)%101;const w=1+r%3;if(i%2===0)o+=`<rect x="${x}" width="${w}" height="40"/>`;x+=w}return `<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" aria-hidden="true">${o}</svg>`}
const gate=(t,d,b)=>`<div class="gate"><div class="thumb">${ic('lock')}</div><h2 style="margin:0 0 8px">${t}</h2><p class="sub" style="margin:0 0 22px">${d}</p><button class="btn" data-a="who" data-v="1">${b}</button></div>`;

/* ===== [수정 위치 4] 화면별 구성 ===== */
const V={
home:()=>`
 <button class="search" data-a="go" data-v="find">${ic('find')}<span>브랜드 혹은 제품명을 검색해보세요</span></button>
 <section class="hero"><p style="opacity:.8;font-size:12.5px">이번 주 신규 입고</p><p class="big">처음 보는 브랜드,<br>알고 고르면 더 좋아요</p><div class="chips"><span class="chip">신규 브랜드 3곳</span><span class="chip">선케어</span><span class="chip">메이크업</span></div></section>
 <button class="strip" data-a="go" data-v="card"><span><b>${S.member?'내 멤버십 바코드':'멤버십에 가입해 보세요'}</b><br><span class="sub">${S.member?'계산할 때 보여주면 구매 이력이 저장돼요':'구매 이력과 회원 핫딜을 앱에서 확인해요'}</span></span>${ic('card')}</button>
 <h2>인디 브랜드 둘러보기</h2>
 <div class="brands">${BR.map(b=>`<button class="brand" data-a="brand" data-v="${b[0]}"><i><img src="${b[1]}" alt="${b[0]} 로고"></i>${b[0]}</button>`).join('')}</div>
 <h2>실구매자 포토 후기</h2><div class="rgrid">${R.map(rev).join('')}</div>
 <p class="note">브랜드 로고를 제외한 상품명·가격·재고·후기는 모두 예시 데이터입니다.</p>`,
find:()=>{const cats=['전체','스킨케어','메이크업','선케어','바디'];
 const list=P.filter(p=>(S.cat==='전체'||p.cat===S.cat)&&(p.nm+p.br).includes(S.q));
 return `<div class="search">${ic('find')}<input id="q" placeholder="브랜드 혹은 제품명을 검색해보세요" value="${S.q}" data-a="q" aria-label="상품 검색"></div>
 <div class="chips" style="margin-top:12px">${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-v="${c}">${c}</button>`).join('')}</div>
 <div class="list" style="margin-top:6px">${list.map(item).join('')||'<p class="sub" style="padding:32px 0;text-align:center">검색 결과가 없어요. 다른 이름으로 찾아보세요.</p>'}</div>`},
store:()=>{const p=P[S.pid],s=p.st[S.store],[lb,cl]=L[s];
 return `<h2 style="margin-top:10px">가까운 매장에서 찾기</h2>
 <div class="chips">${ST.map((t,i)=>`<button class="chip ${S.store===i?'on':''}" data-a="st" data-v="${i}">${t}</button>`).join('')}</div>
 <div class="chips" style="margin-top:8px">${P.map(q=>`<button class="chip ${S.pid===q.id?'on':''}" data-a="pid" data-v="${q.id}">${q.nm.split(' ').slice(0,2).join(' ')}</button>`).join('')}</div>
 <div class="loc"><div style="flex:1"><div class="sub">${ST[S.store]}</div><div style="font-weight:500;margin:2px 0 6px">${p.br} · ${p.nm}</div><span><i class="dot" style="background:${cl}"></i><b>${lb}</b></span></div></div>
 ${s==='have'||s==='low'?`<div class="loc"><div style="flex:1"><div class="sub">매장 내 위치</div><b>${p.loc[S.store]}</b></div>${ic('store')}</div>`:`<div class="box">${s==='out'?'지금은 품절이에요. 다른 매장의 재고를 확인해 보세요.':'재고를 확인하는 중이에요. 방문 전 매장에 문의해 보세요.'}</div>`}
 <p class="note">예시 데이터 · 14:20 기준 · 재고와 진열 위치는 변경될 수 있어요.</p>
 <h2>다른 매장 재고</h2><div class="list">${ST.map((t,i)=>`<button class="item" style="padding:12px 0" data-a="st" data-v="${i}"><div class="row" style="width:100%"><span>${t}</span><span><i class="dot" style="background:${L[p.st[i]][1]}"></i>${L[p.st[i]][0]}</span></div></button>`).join('')}</div>`},
card:()=>!S.member?gate('멤버십에 가입하면','구매 이력이 앱에 자동으로 저장되고, 구매 인증 후기와 회원 쿠폰을 쓸 수 있어요.','멤버십 체험하기'):`
 <div class="card"><div class="row"><div><div style="opacity:.8;font-size:12.5px">오프뷰티 멤버십</div><div style="font-family:var(--serif);font-size:22px;font-weight:700;margin-top:2px">김보라 님</div></div><span class="badge" style="background:rgba(255,255,255,.16);color:#fff">회원</span></div><div class="bar">${barcode()}<small>0000 1234 5678</small></div><p style="font-size:12px;opacity:.8;margin:12px 0 0;text-align:center">계산할 때 직원에게 보여주세요</p></div>
 <h2>구매 이력</h2><div class="list">${HIST.map(h=>`<div class="item" style="align-items:center"><div class="thumb" style="width:52px;height:64px">${pic(h.p,0)}</div><div class="tx"><div class="sub">${h.d} · ${ST[h.st]}</div><div class="nm" style="margin:0">${P[h.p].nm}</div><div class="sub">${h.q}개</div></div><button class="chip" data-a="open" data-v="${h.p}">후기 쓰기</button></div>`).join('')}</div>
 <h2>쿠폰</h2><div class="box row"><span><b>신규 브랜드 1,000원 쿠폰</b><br><span class="sub">11.30까지 · 매장에서 사용</span></span>${ic('deal')}</div>`,
deal:()=>`<div class="hero" style="margin-top:6px"><p style="opacity:.8;font-size:12.5px">11월 회원 핫딜</p><p class="cd">11월 EDIT</p><p style="opacity:.85;font-size:13px">11.09 ~ 11.11 · 회원 대상</p></div>
 ${S.member?`<div class="list" style="margin-top:8px">${DEAL.map(d=>{const p=P[d.p];return `<div class="item" style="align-items:center"><div class="thumb">${pic(p.id,0)}</div><div class="tx"><div class="bn">${p.br}</div><div class="nm" style="margin-bottom:2px">${p.nm}</div><b class="pr">${d.sale}</b> <span class="sub">${d.lim}</span></div><button class="chip on" data-a="open" data-v="${p.id}">보기</button></div>`}).join('')}</div><p class="note">행사 안내는 카카오톡 채널의 광고성 정보 수신에 동의한 분께 보내드려요.</p>`:gate('로그인하면 핫딜 상품이 열려요','핫딜은 회원에게만 공개돼요. 행사 일정은 카카오톡 채널에서 먼저 알려드려요.','회원 화면 체험하기')}`
};

function render(){
 $('screen').innerHTML=V[S.tab]();$('screen').scrollTop=0;
 $('tabs').innerHTML=TABS.map(([k,t])=>`<button class="${S.tab===k?'on':''}" data-a="go" data-v="${k}" ${S.tab===k?'aria-current="page"':''}>${ic(k==='find'?'find':k)}${t}</button>`).join('');
 document.querySelectorAll('.who button').forEach((b,i)=>b.classList.toggle('on',(i===1)===S.member));
}
function sheet(id){
 const p=P[id];S.pid=id;
 $('panel').innerHTML=`<button class="x" data-a="close" aria-label="닫기">${ic('close')}</button><div class="ph0">${pic(id,0)}</div>
 <div class="sub">${p.br} · ${p.cat}</div><h3 style="font-family:var(--serif);font-size:21px;margin:2px 0 8px">${p.nm}</h3>
 <div style="margin-bottom:6px">${price(p)}</div><div class="sub"><span class="stars">${stars(p.rt)}</span> ${p.rt} · 후기 ${p.n}</div>
 <div class="box"><b>가격이 합리적인 이유 · ${p.why}</b><br><span class="sub">${p.whyd}</span></div>
 <div class="row sub"><span>사용기한</span><span>${p.exp}</span></div>
 <h2 style="font-size:16px;margin:18px 0 8px">취급 매장</h2>
 ${ST.map((t,i)=>`<div class="row" style="padding:6px 0"><span>${t}</span><span><i class="dot" style="background:${L[p.st[i]][1]}"></i>${L[p.st[i]][0]}</span></div>`).join('')}
 <h2 style="font-size:16px;margin:18px 0 8px">구매자 후기</h2>${(()=>{const rs=R.filter(r=>r.ps.includes(id));return rs.length?`<div class="rgrid">${rs.map(rev).join('')}</div>`:'<p class="sub">아직 후기가 없어요. 구매 후 첫 후기를 남겨 주세요.</p>'})()}
 <div class="row" style="gap:10px;margin-top:14px"><button class="btn ghost ${S.fav.has(id)?'is-favorite':''}" aria-pressed="${S.fav.has(id)}" style="flex:1" data-a="fav" data-v="${id}">${ic('heart')} 관심 상품</button><button class="btn" style="flex:2" data-a="gostore">이 상품 매장 재고 보기</button></div>`;
 $('sheet').classList.add('on');
}
/* ===== [수정 위치 7] 후기 상세 화면(포스트) ===== */
function post(i){const r=R[i],l=S.lkd.has(i);S.pi=i;
$('post').innerHTML=`<div class="pbar"><button data-a="pclose" aria-label="뒤로">${ic('back')}</button><b>${r.u}의 포스트</b><button data-a="pclose" aria-label="홈">${ic('home')}</button></div><div class="pbody"><div class="u"><i class="av">${r.u[0].toUpperCase()}</i><b>${r.u}</b><span class="badge">구매 인증</span><span style="flex:1"></span>${ic('more')}</div><div class="car">${[...Array(r.n)].map((_,k)=>`<div>${pic(r.ps[k%r.ps.length],1,i+k)}</div>`).join('')}</div><div class="dots">${[...Array(r.n)].map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div><div class="act"><button class="lk${l?' liked':''}" data-a="like" data-v="${i}" aria-label="좋아요">${ic('heart')}${r.lk+(l?1:0)}</button><button data-a="share" aria-label="공유">${ic('share')}</button></div><div class="pchips">${r.ps.map(id=>{const p=P[id];return `<button class="pchip" data-a="open" data-v="${id}"><div class="thumb">${pic(id,0)}</div><div class="pt"><div class="sub">${p.br}</div><div class="nm1">${p.nm}</div>${price(p)}</div></button>`}).join('')}</div><p class="cap"><b>${r.u}</b> ${r.tx}</p><p class="tg">${r.tg.map(t=>'#'+t).join(' ')}</p><p class="note pd"><span class="stars">${stars(r.s)}</span> · ${r.d}</p></div>`;
$('post').classList.add('on')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('post').parentNode.appendChild(t);setTimeout(()=>t.remove(),1600)}
const A={
 who:v=>{S.member=v==='1';render();if($('post').classList.contains('on'))post(S.pi);if($('sheet').classList.contains('on'))sheet(S.pid)},
 go:v=>{S.tab=v;render()},
 cat:v=>{S.cat=v;render()},
 q:()=>{S.q=$('q').value;const pos=S.q.length;const l=document.querySelector('.list');l.innerHTML=P.filter(p=>(S.cat==='전체'||p.cat===S.cat)&&(p.nm+p.br).includes(S.q)).map(item).join('')||'<p class="sub" style="padding:32px 0;text-align:center">검색 결과가 없어요. 다른 이름으로 찾아보세요.</p>'},
 st:v=>{S.store=+v;render()},
 pid:v=>{S.pid=+v;render()},
 open:v=>sheet(+v),
 close:(v,e)=>{if(e.target.id==='sheet'||e.target.closest('.x'))$('sheet').classList.remove('on')},
 fav:v=>{S.fav.has(+v)?S.fav.delete(+v):S.fav.add(+v);sheet(+v)},
 brand:v=>{S.q=v;S.cat='전체';S.tab='find';render()},
 post:v=>{$('sheet').classList.remove('on');post(+v)},
 pclose:()=>{$('post').classList.remove('on');document.querySelectorAll('.rc').forEach(c=>{const i=+c.dataset.v,k=c.querySelector('.lkc');k.classList.toggle('liked',S.lkd.has(i));k.lastChild.textContent=R[i].lk+(S.lkd.has(i)?1:0)})},
 like:v=>{v=+v;S.lkd.has(v)?S.lkd.delete(v):S.lkd.add(v);const b=document.querySelector('.act .lk');b.classList.toggle('liked',S.lkd.has(v));b.lastChild.textContent=R[v].lk+(S.lkd.has(v)?1:0)},
 share:()=>toast('공유 기능은 앱에서 연결돼요'),
 gostore:()=>{$('sheet').classList.remove('on');S.tab='store';render()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.dataset.a==='q')return;if(t.dataset.a==='close'&&e.target.id!=='sheet'&&!e.target.closest('.x'))return;A[t.dataset.a](t.dataset.v,e)});
document.addEventListener('scroll',e=>{const c=e.target;if(c.classList&&c.classList.contains('car')){const k=Math.round(c.scrollLeft/c.clientWidth);c.nextElementSibling.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===k))}},true);
document.addEventListener('input',e=>{if(e.target.id==='q')A.q()});

V.home=()=>`
<button class="search" data-a="go" data-v="find">${ic('find')}<span>지금 찾고 있는 뷰티 아이템은?</span></button>
<section class="editorial"><div class="editorial-photo"><img src="${PHOTO[0]}" alt="아페리레 포어 마스크 연출 사진"><span class="edition">THE BEAUTY EDIT / 01</span></div><div class="editorial-copy"><div class="eyebrow">NEW DISCOVERY</div><h1>몰랐던 취향을 만나는 곳,<br>오프뷰티.</h1><p>새로운 브랜드부터 다시 찾고 싶은 아이템까지.<br>이번 주 매장에서 만날 뷰티를 먼저 둘러보세요.</p><div class="editorial-foot"><button data-a="go" data-v="find">이번 주 발견하기 ↗</button><span class="pagination">01 — 03</span></div></div></section>
<div class="quick">${[['find','신규 입고'],['store','매장 재고'],['card','멤버십'],['deal','회원 혜택']].map(([k,t])=>`<button data-a="go" data-v="${k}">${ic(k)}${t}</button>`).join('')}</div>
<button class="strip" data-a="go" data-v="card"><span><b>${S.member?'오늘도, 나의 뷰티 기록':'매장에서의 발견을, 내 기록으로'}</b><br><span class="sub">${S.member?'내 회원증과 구매 이력을 확인하세요':'멤버십으로 구매 이력과 회원 혜택을 모아보세요'}</span></span>${ic('card')}</button>
<div class="section-head"><h2>이번 주 눈여겨볼 아이템</h2><button data-a="go" data-v="find">전체 보기 ↗</button></div><p class="sub">매장에 가기 전, 취향부터 골라두세요.</p><div class="product-grid">${P.slice(0,4).map(item).join('')}</div>
<h2>새롭게 만나는 브랜드</h2><div class="brands">${BR.map(b=>`<button class="brand" data-a="brand" data-v="${b[0]}"><i><img src="${b[1]}" alt="${b[0]}"></i>${b[0]}</button>`).join('')}</div>
<div class="section-head"><h2>취향이 담긴 뷰티 노트</h2><span class="eyebrow" style="margin:0">BEAUTY NOTES</span></div><p class="sub">구매 후기를 탐색하는 화면 예시예요.</p><div class="rgrid">${R.map(rev).join('')}</div>
<div class="demo-foot">OFFBEAUTY · 디자인 프로토타입<br>상품·가격·재고·후기·회원 정보는 예시입니다.</div>`;
const originalFind=V.find;V.find=()=>originalFind().replace('class="list"','class="list product-grid"');
const originalQuery=A.q; A.q=()=>{originalQuery()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){ $('sheet').classList.remove('on');$('post').classList.remove('on')}});

render();
</script>
</body>
</html>
